[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab"
version = "0.2.0"
description = "Evaluation and observability platform for LLM agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "pytest",
    "sqlalchemy",
    "rich",
    "streamlit",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff",
]

[project.scripts]
agentlab = "agentlab.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentlab*", "dashboard*"]
exclude = ["datasets*", "fixtures*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
exclude = [
    "fixtures/*",
]
